<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Look Book - Fifty Hounds</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --gray: #101111;
      --light-gray: #232728;
      --light-yellow: #d1c5b5;
      --dark-yellow: #8b3d16;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--gray);
      color: var(--light-yellow);
      font-family: "IM Fell English", serif;
      font-size: 18px;
      line-height: 1.7;
      min-height: 100vh;
      overflow-x: hidden;
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(16, 17, 17, 0.85);
      border-bottom: 2px solid var(--light-gray);
      z-index: 1000;
      padding: 1.2rem 2rem;
      backdrop-filter: blur(8px);
    }

    nav ul {
      list-style: none;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 2.5rem;
    }

    nav a {
      color: var(--light-yellow);
      text-decoration: none;
      font-family: "IM Fell English SC", serif;
      font-size: 0.95rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: all 0.3s ease;
      position: relative;
    }

    nav a::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 0;
      width: 0;
      height: 1px;
      background: var(--dark-yellow);
      transition: width 0.3s ease;
    }

    nav a:hover {
      color: var(--dark-yellow);
    }

    nav a:hover::after {
      width: 100%;
    }

    main {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: calc(100vh - 76px);
      /* subtract nav height */
      margin-top: 76px;
      /* match nav height exactly */
      background: var(--gray);
    }

    .lookbook-image {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      /* ensures full image shows, no cropping */
      display: block;
    }

    footer {
      text-align: center;
      padding: 2rem;
      font-size: 0.9rem;
      color: var(--light-yellow);
    }

    footer a {
      color: var(--dark-yellow);
      text-decoration: none;
    }

    footer a:hover {
      color: var(--light-yellow);
    }

    @media (max-width: 768px) {
      main {
        height: calc(100vh - 70px);
        margin-top: 70px;
      }
    }
    .support-link {
  text-align: center;
  margin-top: 4rem;
  margin-bottom: 2rem;
}

.support-link a {
  display: inline-block;
  font-family: "IM Fell English SC", serif;
  color: var(--dark-yellow);
  font-size: 1.1rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  text-decoration: none;
  border: 1.5px solid var(--dark-yellow);
  padding: 0.6rem 1.4rem;
  transition: all 0.3s ease;
}

.support-link a:hover {
  background: var(--dark-yellow);
  color: var(--gray);
  transform: scale(1.05);
}

  </style>
</head>

<body>
  <nav>
    <ul>
      <li><a href="index.html#home">Home</a></li>
      <li><a href="crew.html">The Crew</a></li>
      <li><a href="diana.html">Diana</a></li>
      <li><a href="lookbook.html">Look Book</a></li>
      <li><a href="funding.html">Fundraising</a></li>
    </ul>
  </nav>

  <main>
    <img src="lookbook.jpg" alt="Fifty Hounds Look Book" class="lookbook-image">
  </main>
  <main>
    <img src="comparables.jpg" alt="Fifty Hounds Look Book" class="lookbook-image">
  </main>
  <div class="support-link">
    <a href="[link]" target="_blank">Support our film →</a>
  </div>


  <footer>
    <p>© 2025 Juliette Mangon |
      <a href="https://juliettemangon.com/" target="_blank">juliettemangon.com</a>
    </p>
  </footer>

</body>

</html>
