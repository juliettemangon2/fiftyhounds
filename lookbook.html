<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Look Book - Fifty Hounds</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.ico" type="image/x-icon" />

  <style>
    :root {
      --gray: #101111;
      --light-gray: #232728;
      --light-yellow: #d1c5b5;
      --dark-yellow: #8b3d16;
      --dark-orange: #8b3d16;
      --bright-orange: #c74707;
      --light-yellow: #d1c5b5;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--gray);
      color: var(--light-yellow);
      font-family: "IM Fell English", serif;
      font-size: 18px;
      line-height: 1.7;
      min-height: 100vh;
      overflow-x: hidden;
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(16, 17, 17, 0.85);
      border-bottom: 2px solid var(--light-gray);
      z-index: 1000;
      padding: 1.2rem 2rem;
      backdrop-filter: blur(8px);
    }

    nav ul {
      list-style: none;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 2.5rem;
    }

    nav a {
      color: var(--light-yellow);
      text-decoration: none;
      font-family: "IM Fell English SC", serif;
      font-size: 0.95rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: all 0.3s ease;
      position: relative;
    }

    nav a::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 0;
      width: 0;
      height: 1px;
      background: var(--dark-yellow);
      transition: width 0.3s ease;
    }

    nav a:hover {
      color: var(--dark-yellow);
    }

    nav a:hover::after {
      width: 100%;
    }

    main {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: calc(100vh - 76px);
      /* subtract nav height */
      margin-top: 76px;
      /* match nav height exactly */
      background: var(--gray);
    }

    .lookbook-image {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      /* ensures full image shows, no cropping */
      display: block;
    }

    footer {
      text-align: center;
      padding: 2rem;
      font-size: 0.9rem;
      color: var(--light-yellow);
    }

    footer a {
      color: var(--dark-yellow);
      text-decoration: none;
    }

    footer a:hover {
      color: var(--light-yellow);
    }

    @media (max-width: 768px) {
      main {
        height: calc(100vh - 70px);
        margin-top: 70px;
      }
    }

    h2 {
      text-align: center;
      text-transform: uppercase;
      margin-top: 7rem;
      font-size: 2.5rem;
      color: var(--light-yellow);
      letter-spacing: 0.1em;
    }

    h3 {
      text-align: center;
      text-transform: uppercase;
      margin-top: 7rem;
      font-size: 2rem;
      color: var(--dark-yellow);
      letter-spacing: 0.1em;

    }

    .support-link {
      text-align: center;
      margin-top: 8rem;
      margin-bottom: 2rem;
    }

    .support-link a {
      display: inline-block;
      font-family: "IM Fell English SC", serif;
      color: var(--light-yellow);
      font-size: 1.4rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      text-decoration: none;
      border: 3px solid var(--dark-orange);
      padding: 0.6rem 1.4rem;
      transition: all 0.3s ease;
      background-color: var(--dark-orange)
    }

    .support-link a:hover {
      background: var(--light-yellow);
      color: var(--dark-orange);
    }

    /* ===== Carousel Container ===== */
    .carousel-container {
      position: relative;
      width: 100%;
      overflow: hidden;
      margin-top: 2rem;
    }

    .carousel-track {
      display: flex;
      gap: 30px;
      will-change: transform;
    }


    .carousel-track img {
      height: 60vh;
      object-fit: cover;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .carousel-track img:hover {
      transform: scale(1.03);
    }




    @media (max-width: 768px) {
      .carousel-track img {
        height: 50vh;
      }
    }

    /* ===== Lightbox ===== */
    .lightbox {
      display: none;
      position: fixed;
      z-index: 1000;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 85vh;
      object-fit: contain;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: var(--light-yellow);
      font-size: 2.5rem;
      cursor: pointer;
      user-select: none;
      padding: 0 1rem;
    }

    .lightbox .arrow.left {
      left: 20px;
    }

    .lightbox .arrow.right {
      right: 20px;
    }

    .lightbox .close {
      position: absolute;
      top: 30px;
      right: 40px;
      font-size: 2rem;
      cursor: pointer;
      color: var(--light-yellow);
    }
  </style>
</head>

<body>
  <nav>
    <ul>
      <li><a href="index.html#home">Home</a></li>
      <li><a href="crew.html">The Crew</a></li>
      <li><a href="diana.html">Diana</a></li>
      <li><a href="lookbook.html">Look Book</a></li>
      <li><a href="funding.html">Fundraising</a></li>
    </ul>
  </nav>

  <h2>Film Comparables</h2>
  <h3>The Devil All the Time (2020)</h3>
  <div class="carousel-container">
    <div class="carousel-track" id="carousel">
      <!-- loop twice for smooth scroll -->
      <script>
        for (let i = 1; i <= 3; i++) {
          document.write(`<img src="devil/${i}.jpg" alt="Film comparable ${i}" onclick="openLightbox('devil', ${i})">`);
        }
        
      </script>
    </div>
  </div>
  <h3>The Wind (2018)</h3>
  <div class="carousel-container">
    <div class="carousel-track" id="carousel">
      <!-- loop twice for smooth scroll -->
      <script>
        for (let i = 1; i <= 3; i++) {
          document.write(`<img src="wind/${i}.jpg" alt="Film comparable ${i}" onclick="openLightbox('wind', ${i})">`);
        }
        for (let i = 1; i <= 3; i++) {
          document.write(`<img src="wind/${i}.jpg" alt="Film comparable ${i}" onclick="openLightbox('wind', ${i})">`);
        }
      </script>
    </div>
  </div>
  <h3>The Witch (2016)</h3>
  <div class="carousel-container">
    <div class="carousel-track" id="carousel">
      <!-- loop twice for smooth scroll -->
      <script>
        for (let i = 1; i <= 3; i++) {
          document.write(`<img src="witch/${i}.jpg" alt="Film comparable ${i}" onclick="openLightbox('witch', ${i})">`);
        }
        for (let i = 1; i <= 3; i++) {
          document.write(`<img src="witch/${i}.jpg" alt="Film comparable ${i}" onclick="openLightbox('witch', ${i})">`);
        }
      </script>
    </div>
  </div>
  <h3>Killing of a Sacred Deer (2017)</h3>
  <div class="carousel-container">
    <div class="carousel-track" id="carousel">
      <!-- loop twice for smooth scroll -->
      <script>
        for (let i = 1; i <= 3; i++) {
          document.write(`<img src="deer/${i}.jpg" alt="Film comparable ${i}" onclick="openLightbox('deer', ${i})">`);
        }
        for (let i = 1; i <= 3; i++) {
          document.write(`<img src="deer/${i}.jpg" alt="Film comparable ${i}" onclick="openLightbox('deer', ${i})">`);
        }
      </script>
    </div>
  </div>


  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <span class="close" onclick="closeLightbox()">×</span>
    <span class="arrow left" onclick="changeImage(-1)">‹</span>
    <img id="lightbox-img" src="" alt="">
    <span class="arrow right" onclick="changeImage(1)">›</span>
  </div>



  <div class="support-link">
    <a href="funding.html" target="_blank">Support our film →</a>
  </div>


  <footer>
    <p>© 2025 Juliette Mangon |
      <a href="https://juliettemangon.com/" target="_blank">juliettemangon.com</a>
    </p>
  </footer>
  <script>
    let currentIndex = 0;
    let currentFolder = '';
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');

    function openLightbox(folder, index) {
      currentFolder = folder;
      currentIndex = index;
      lightboxImg.src = `${folder}/${index}.jpg`;
      lightbox.classList.add('active');
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
    }

    function changeImage(direction) {
      currentIndex += direction;

      if (currentIndex < 1) currentIndex = 3; // wrap around backward
      if (currentIndex > 3) currentIndex = 1; // wrap around forward

      lightboxImg.src = `${currentFolder}/${currentIndex}.jpg`;
    }

    document.addEventListener('keydown', e => {
      if (!lightbox.classList.contains('active')) return;
      if (e.key === 'ArrowRight') changeImage(1);
      if (e.key === 'ArrowLeft') changeImage(-1);
      if (e.key === 'Escape') closeLightbox();
    });
    const tracks = document.querySelectorAll('.carousel-track');
    const scrollSpeed = 1.3;

    tracks.forEach(track => {
      let scrollPos = 0;

      function loopCarousel() {
        scrollPos -= scrollSpeed;
        const firstImage = track.firstElementChild;
        const firstImageWidth = firstImage.clientWidth + 30;

        if (Math.abs(scrollPos) >= firstImageWidth) {
          track.appendChild(firstImage);
          scrollPos += firstImageWidth;
        }

        track.style.transform = `translateX(${scrollPos}px)`;
        requestAnimationFrame(loopCarousel);
      }

      loopCarousel();
    });
  </script>
</body>

</html>
