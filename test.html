<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Look Book - Fifty Hounds</title>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&display=swap" rel="stylesheet">

  <style>
    :root {
      --gray: #101111;
      --light-yellow: #d1c5b5;
      --accent: #8b3d16;
    }

    body {
      margin: 0;
      background: var(--gray);
      font-family: "IM Fell English", serif;
      color: var(--light-yellow);
      overflow-x: hidden;
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(16,17,17,0.85);
      border-bottom: 2px solid rgba(255,255,255,0.1);
      z-index: 10;
      padding: 1.2rem 2rem;
      text-align: center;
    }

    nav a {
      color: var(--light-yellow);
      text-decoration: none;
      margin: 0 1rem;
      font-family: "IM Fell English SC", serif;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: var(--accent);
    }

    h2 {
      text-align: center;
      text-transform: uppercase;
      margin-top: 7rem;
      font-size: 2.5rem;
      color: var(--light-yellow);
      letter-spacing: 0.1em;
    }

    /* ===== Carousel Container ===== */
    .carousel-container {
      position: relative;
      width: 100%;
      overflow: hidden;
      margin-top: 2rem;
    }

    .carousel-track {
      display: flex;
      gap: 6px; /* small space between images */
      animation: slowScroll 7s linear infinite;
    }

    .carousel-track img {
      height: 65vh;
      object-fit: cover;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .carousel-track img:hover {
      transform: scale(1.03);
    }

    @keyframes slowScroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); } /* half loop for smooth repeating */
    }

    @media (max-width: 768px) {
      .carousel-track img {
        height: 50vh;
      }
    }

    /* ===== Lightbox ===== */
    .lightbox {
      display: none;
      position: fixed;
      z-index: 1000;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 85vh;
      object-fit: contain;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: var(--light-yellow);
      font-size: 2.5rem;
      cursor: pointer;
      user-select: none;
      padding: 0 1rem;
    }

    .lightbox .arrow.left { left: 20px; }
    .lightbox .arrow.right { right: 20px; }

    .lightbox .close {
      position: absolute;
      top: 30px;
      right: 40px;
      font-size: 2rem;
      cursor: pointer;
      color: var(--light-yellow);
    }
  </style>
</head>

<body>
  <nav>
    <a href="index.html#home">Home</a>
    <a href="crew.html">The Crew</a>
    <a href="diana.html">Diana</a>
    <a href="lookbook.html">Look Book</a>
    <a href="funding.html">Fundraising</a>
  </nav>

  <h2>Film Comparables</h2>

  <div class="carousel-container">
    <div class="carousel-track" id="carousel">
      <!-- loop twice for smooth scroll -->
      <!-- IMAGES 2–14 -->
      <script>
        for (let i = 2; i <= 12; i++) {
          document.write(`<img src="film comparables/${i}.jpg" alt="Film comparable ${i}" onclick="openLightbox(${i})">`);
        }
        for (let i = 2; i <= 12; i++) {
          document.write(`<img src="film comparables/${i}.jpg" alt="Film comparable ${i}" onclick="openLightbox(${i})">`);
        }
      </script>
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <span class="close" onclick="closeLightbox()">×</span>
    <span class="arrow left" onclick="changeImage(-1)">‹</span>
    <img id="lightbox-img" src="" alt="">
    <span class="arrow right" onclick="changeImage(1)">›</span>
  </div>

  <script>
    let currentIndex = 0;
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const totalImages = 13;

    function openLightbox(index) {
      currentIndex = index;
      lightboxImg.src = `film comparables/${index}.jpg`;
      lightbox.classList.add('active');
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
    }

    function changeImage(direction) {
      currentIndex += direction;
      if (currentIndex < 2) currentIndex = 14;
      if (currentIndex > 14) currentIndex = 2;
      lightboxImg.src = `film comparables/${currentIndex}.jpg`;
    }

    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('active')) return;
      if (e.key === 'ArrowRight') changeImage(1);
      if (e.key === 'ArrowLeft') changeImage(-1);
      if (e.key === 'Escape') closeLightbox();
    });
  </script>
</body>
</html>
